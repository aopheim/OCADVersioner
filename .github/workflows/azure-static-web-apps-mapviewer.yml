name: MapViewer Deploy

# The Blazor WebAssembly map viewer deploys to its OWN Static Web App, separate
# from the two that serve the Angular app (icy-pond for main, thankful-coast for
# develop). Those are untouched, so a problem here can never take the live app
# down - which is the whole point of Stage 9.
#
# It is built here and uploaded prebuilt, because Oryx cannot build .NET 10
# Blazor WebAssembly and has no wasm-tools workload.

on:
    push:
        branches:
            - main
            - develop
        # A native relink is 3-10 minutes, so Angular-only commits must not pay
        # for it.
        paths:
            - 'map-viewer/**'
            - '.github/workflows/azure-static-web-apps-mapviewer.yml'

jobs:
    build_and_deploy_job:
        runs-on: ubuntu-latest
        name: Build and Deploy Job

        env:
            # setup-dotnet installs into /usr/share/dotnet by default, and
            # `dotnet workload install` puts wasm-tools inside that same root.
            # Pinning the root into the workspace is what makes the workload
            # cacheable at all - caching ~/.dotnet would silently cache nothing.
            DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache the SDK, the wasm-tools workload and NuGet
              uses: actions/cache@v4
              with:
                  # wasm-tools is roughly 1.5 GB: Emscripten, the Mono AOT cross
                  # compiler and the runtime packs.
                  path: |
                      ${{ github.workspace }}/.dotnet
                      ~/.nuget/packages
                  key: wasm-${{ runner.os }}-10.0.x-${{ hashFiles('map-viewer/Directory.Packages.props') }}
                  restore-keys: |
                      wasm-${{ runner.os }}-10.0.x-

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Install the wasm-tools workload
              run: dotnet workload install wasm-tools

            # AOT is on for publish: it makes parsing a map about 16x faster and
            # tiles 4-5x faster, and costs most of this job's running time.
            - name: Publish
              run: dotnet publish map-viewer/src/OcadViewer.Wasm -c Release -o publish

            # appsettings.json ships with an empty connection string so local
            # builds report nothing and fetch no SDK. Without this step the
            # deployed app is silent too.
            - name: Inject the telemetry key
              run: |
                  jq --arg k "${{ secrets.APPINSIGHTSINSTRUMENTATIONKEY_PROD }}" \
                     '.Telemetry.ConnectionString = $k' \
                     publish/wwwroot/appsettings.json > appsettings.tmp
                  mv appsettings.tmp publish/wwwroot/appsettings.json

            - name: Build And Deploy
              id: builddeploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  # Rename this secret to match the Azure-generated name once the
                  # Static Web App exists, the way the Angular two are named.
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MAPVIEWER }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
                  action: 'upload'
                  app_location: '/publish/wwwroot' # Already published - see skip_app_build
                  api_location: ''
                  output_location: ''
                  # Load-bearing. Without it the deploy hands the directory to
                  # Oryx, which cannot build this and will not admit why.
                  skip_app_build: true
                  # Both branches deploy to the one Static Web App, so develop
                  # goes to a named environment rather than over production.
                  # Written this way round on purpose: '' is falsy in an Actions
                  # expression, so `main && '' || 'develop'` would yield
                  # 'develop' on main - the classic ternary trap.
                  deployment_environment: ${{ github.ref == 'refs/heads/develop' && 'develop' || '' }}
                  # Lets the workflow land before the Azure resource and its
                  # token exist, rather than failing every push until they do.
                  skip_deploy_on_missing_secrets: true

            # Azure Static Web Apps compresses dynamically and does NOT serve the
            # .br companions the publish produces. Once this is live, check
            # Content-Encoding on dotnet.native.wasm: if it is absent, the 7 MB
            # native module is shipping uncompressed and wants a
            # loadBootResource hook that fetches the .br and decodes it.
