name: CI

# The job id, build-and-test, is the check the rulesets on main and develop
# require. Renaming it blocks every pull request until the rulesets follow.

# No `types:` filter, so this runs on opened, reopened and every push to the
# branch. With `types: [opened]` a required check could only ever report on the
# first commit: push a fix for a failing build and nothing re-ran, leaving the
# PR gated on a verdict about code that was no longer there.
#
# No `branches:` filter either: stacked pull requests target the branch below
# them, not develop, and their builds and tests matter just as much.
on:
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        # Every dotnet command runs from map-viewer so that map-viewer/global.json
        # picks the SDK. The runner image ships a newer SDK than the app targets,
        # and without the pin `dotnet` uses that one: its `wasm-tools` is not the
        # workload a net10.0 app needs (wasm-tools-net10), and the build fails
        # with NETSDK1147.
        defaults:
            run:
                working-directory: map-viewer

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Use .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: map-viewer/global.json

            - name: Show the SDK in use
              run: dotnet --version

            # SkiaSharp and HarfBuzz ship native WebAssembly assets, so even a
            # non-AOT build goes through the wasm native toolchain.
            - name: Install the wasm-tools workload
              run: dotnet workload install wasm-tools

            # AOT is a publish-only setting, so this stays a normal build.
            - name: Build
              run: dotnet build MapViewer.slnx -c Release

            # The solution rather than the one test project, so a suite added
            # later is picked up without touching this file. The browser tests
            # are left to the e2e job below: they need a published site, Node and
            # Playwright's browsers, none of which this job sets up.
            - name: Test
              run: dotnet test MapViewer.slnx -c Release --no-build --filter "TestCategory!=E2E"

    # Every page's happy path in a real browser, against the published bundle.
    # A job of its own so build-and-test stays quick, and so a browser failure
    # is told apart from a unit test failure at a glance. See map-viewer/E2E-PLAN.md.
    e2e:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: map-viewer

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Use .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: map-viewer/global.json

            - name: Install the wasm-tools workload
              run: dotnet workload install wasm-tools

            # Without AOT: the deploy's AOT publish takes far too long for a PR
            # gate. This is still the real bundle - trimmed, fingerprinted and
            # served as static files the way Azure Static Web Apps serves it.
            - name: Publish the app
              run: dotnet publish src/OcadViewer.Wasm -c Release -p:RunAOTCompilation=false -p:WasmStripILAfterAOT=false

            - name: Build the tests
              run: dotnet build tests/OcadViewer.E2ETests -c Release

            # The script comes with the Playwright package, so the browser it
            # installs always matches the library version the tests use.
            - name: Install Chromium
              run: pwsh tests/OcadViewer.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

            - name: Run the end-to-end tests
              run: dotnet test tests/OcadViewer.E2ETests -c Release --no-build --logger "console;verbosity=normal"

            - name: Upload traces of failed tests
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: map-viewer/tests/OcadViewer.E2ETests/bin/Release/net10.0/playwright-traces/
                  if-no-files-found: ignore
