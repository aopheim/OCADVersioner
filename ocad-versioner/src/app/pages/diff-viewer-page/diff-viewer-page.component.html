<div class="container-fluid">
    <div *ngIf="appProgress$ | async as appProgress">
        <div class="progress" style="height: 2px" *ngIf="appProgress.isLoading">
            <div
                class="progress-bar"
                role="progressbar"
                [style.width.%]="appProgress.currentProgress"
                aria-valuenow="appProgress.currentProgress"
                aria-valuemin="0"
                aria-valuemax="100"
            ></div>
        </div>
        <div *ngIf="!appProgress.isLoading" style="height: 2px"></div>
    </div>
    <div class="d-flex justify-content-between align-items-center">
        <h3 class="my-2">{{ '#_OCADVersioner' | translate }}</h3>
        <div>
            <a href="./about" target="_blank">
                <i class="bi bi-book cursorPointer mx-3 h4 noColor"></i>
            </a>
            <i
                class="bi bi-sliders cursorPointer mx-3 h4"
                data-bs-toggle="modal"
                data-bs-target="#appSettingsModal"
            >
            </i>
        </div>
    </div>
    <app-settings-modal></app-settings-modal>
    <div *ngIf="selectedTableView$ | async as selectedTableView">
        <div class="d-flex justify-content-center">
            <current-version-comparison
                [newestVersionName]="
                    (newestVersionMetaData$ | async)?.fileName ?? null
                "
                [oldestVersionName]="
                    (oldestVersionMetaData$ | async)?.fileName ?? null
                "
                [isHistory]="false"
            ></current-version-comparison>
        </div>
        <ocad-map-viewer
            *ngIf="bboxOfNewestVersion$ | async as bbox"
            [bboxOfMap]="bbox"
            [selectedVersionNumbers]="null"
            [mapFiles]="mapFiles"
            (mapFileDropped)="setDroppedMapFile($event)"
        ></ocad-map-viewer>
        <ng-container *ngIf="diffTable$ | async as diffTable">
            <diff-table-tabs
                [diffTable]="diffTable"
                (selectedTableView)="setSelectedTableView($event)"
            ></diff-table-tabs>
            <ocad-diff-table
                [tableInput]="diffTable"
                [tableView]="selectedTableView"
                class="mt-3"
            ></ocad-diff-table>
        </ng-container>
    </div>
</div>
